<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Test: Pferde</title>
  <base href="../">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="spielfeld">
    <div id="hud" class="sichtbar"><div id="meldung"></div></div>
  </div>
  <script type="module">
    // Testseite: Gelände, Natur (Hindernisse), Himmel, Spieler und Pferde
    import * as THREE from 'three';
    import { EINSTELLUNGEN } from './js/einstellungen.js';
    import { baueGelaende, bodenHoehe } from './js/gelaende.js';
    import { baueNatur } from './js/natur.js';
    import { Hindernisse } from './js/hindernisse.js';
    import { Wasser } from './js/wasser.js';
    import { Himmel } from './js/himmel.js';
    import { Tageszeit } from './js/tageszeit.js';
    import { Spieler } from './js/spieler.js';
    import { Pferde } from './js/pferde.js';

    const spielfeld = document.getElementById('spielfeld');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    spielfeld.prepend(renderer.domElement);
    const szene = new THREE.Scene();
    const kamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);

    const hindernisse = new Hindernisse();
    szene.add(baueGelaende());
    baueNatur(szene, hindernisse);
    const wasser = new Wasser(szene);
    const himmel = new Himmel(szene, renderer);
    const tageszeit = new Tageszeit();
    tageszeit.zeit = 70; // heller Vormittag
    const spieler = new Spieler(szene, hindernisse);

    // Mini-Rucksack zum Testen
    const rucksack = {
      dinge: { apfel: 0 },
      hat(id) { return (this.dinge[id] || 0) > 0; },
      anzahl(id) { return this.dinge[id] || 0; },
      nehmen(id, n) { this.dinge[id] = Math.max(0, (this.dinge[id] || 0) - n); },
    };
    const meldungen = [];
    const meldung = (text) => { meldungen.push(text); document.getElementById('meldung').textContent = text; };
    const musik = { pling() {} };
    const base = { stall: { x: 12, z: -4, winkel: 0 } };
    // Stall-Attrappe: ein Holzboden
    const boden = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.2, 24), new THREE.MeshStandardMaterial({ color: '#a0703a' }));
    boden.position.set(12, bodenHoehe(12, -4) + 0.05, -4);
    szene.add(boden);

    const pferde = new Pferde(szene, hindernisse, { rucksack, meldung, musik, spieler, base });

    // Kamera wie im Spiel: schwebt hinter der Figur
    let kameraWinkel = 0, kameraNeigung = 0.35;
    const kameraPos = new THREE.Vector3(0, 30, 40);
    function bewegeKamera(dt, sofort = false) {
      const p = spieler.figur.position;
      const abstand = EINSTELLUNGEN.kameraAbstand;
      const ziel = new THREE.Vector3(
        p.x + Math.sin(kameraWinkel) * Math.cos(kameraNeigung) * abstand,
        p.y + 1.5 + Math.sin(kameraNeigung) * abstand,
        p.z + Math.cos(kameraWinkel) * Math.cos(kameraNeigung) * abstand
      );
      ziel.y = Math.max(ziel.y, bodenHoehe(ziel.x, ziel.z) + 1, 0.8);
      if (sofort) kameraPos.copy(ziel); else kameraPos.lerp(ziel, Math.min(1, dt * 8));
      kamera.position.copy(kameraPos);
      kamera.lookAt(p.x, p.y + 1.6, p.z);
    }

    // Wie das Spiel: Interaktion suchen (das Nächste gewinnt)
    function naechsteInteraktion() {
      const pos = spieler.figur.position;
      let beste = null, d0 = Infinity;
      for (const ia of pferde.interaktionen) {
        if (ia.aktiv && !ia.aktiv()) continue;
        const d = Math.hypot(ia.pos.x - pos.x, ia.pos.z - pos.z);
        if (d < ia.radius && d < d0) { beste = ia; d0 = d; }
      }
      return beste;
    }

    const fehler = [];
    window.addEventListener('error', (e) => fehler.push(String(e.message)));

    // Ein Spiel-Schritt (wie die Spielschleife in main.js)
    function schritt(dt, richtung = { x: 0, y: 0 }) {
      tageszeit.aktualisiere(dt);
      if (pferde.reitet) pferde.steuern(dt, richtung, kameraWinkel);
      else spieler.aktualisiere(dt, richtung, false, kameraWinkel);
      bewegeKamera(dt);
      pferde.aktualisiere(dt, spieler.figur.position, himmel.helligkeit);
    }
    function male() {
      himmel.aktualisiere(0.016, tageszeit, kamera, spieler.figur.position);
      wasser.aktualisiere(0.016);
      renderer.render(szene, kamera);
      return renderer.info.render.calls;
    }

    window.__t = {
      THREE, pferde, spieler, rucksack, meldungen, base, hindernisse, bodenHoehe, fehler, renderer, kamera, tageszeit,
      schritt, male, naechsteInteraktion, bewegeKamera,
      set kameraWinkel(w) { kameraWinkel = w; }, get kameraWinkel() { return kameraWinkel; },
      set kameraNeigung(w) { kameraNeigung = w; },
      teleport(x, z) {
        spieler.figur.position.set(x, bodenHoehe(x, z), z);
        bewegeKamera(0, true);
      },
      viele(n, dt, richtung) { for (let i = 0; i < n; i++) schritt(dt, richtung); },
      // Draw Calls nur von den Pferden zählen
      pferdeCalls() {
        const alt = szene.children.map((c) => c.visible);
        szene.children.forEach((c) => (c.visible = c === pferde.gruppe || c.isLight));
        const sm = renderer.shadowMap.enabled;
        renderer.shadowMap.enabled = false;
        renderer.render(szene, kamera);
        const calls = renderer.info.render.calls, dreiecke = renderer.info.render.triangles;
        renderer.shadowMap.enabled = sm;
        szene.children.forEach((c, i) => (c.visible = alt[i]));
        return { calls, dreiecke };
      },
    };
    window.__bereit = true;
  </script>
</body>
</html>
