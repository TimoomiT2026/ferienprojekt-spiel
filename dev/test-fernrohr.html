<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Test: Fernrohr</title>
  <base href="../">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fernrohr.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="spielfeld">
    <div id="hud" class="sichtbar"><div id="meldung"></div></div>
    <button id="knopf-start" style="position:absolute;left:16px;bottom:16px;width:120px;height:70px;font-size:22px;z-index:5">🔭 Gucken</button>
  </div>
  <script type="module">
    // Testseite: nur Gelände, Wasser, Himmel und ein paar Ziel-Marker
    import * as THREE from 'three';
    import { baueGelaende, bodenHoehe } from './js/gelaende.js';
    import { Wasser } from './js/wasser.js';
    import { Himmel } from './js/himmel.js';
    import { Tageszeit } from './js/tageszeit.js';
    import { knopf } from './js/steuerung.js';
    import { Fernrohr } from './js/fernrohr.js';

    const spielfeld = document.getElementById('spielfeld');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    spielfeld.prepend(renderer.domElement);
    const szene = new THREE.Scene();
    const kamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);
    szene.add(baueGelaende());
    const wasser = new Wasser(szene);
    const himmel = new Himmel(szene, renderer);
    const tageszeit = new Tageszeit();
    tageszeit.zeit = 60; // heller Vormittag

    // Ziel-Marker: rote Kugeln auf Stangen im Wasser
    const spielerPos = new THREE.Vector3(5, bodenHoehe(5, 118), 118) // oben auf einem Berg;
    const marker = [];
    [[0, 150], [60, 220], [300, 200], [180, 400], [20, 450], [330, 700]].forEach(([grad, weite], i) => {
      const w = grad * Math.PI / 180;
      const pos = new THREE.Vector3(spielerPos.x + Math.sin(w) * weite, 0, spielerPos.z + Math.cos(w) * weite);
      const g = new THREE.Group();
      const stange = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 8), new THREE.MeshStandardMaterial({ color: '#ffffff' }));
      stange.position.y = 4;
      const kugel = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 12), new THREE.MeshStandardMaterial({ color: '#e8402a' }));
      kugel.position.y = 9;
      g.add(stange, kugel);
      g.position.copy(pos);
      szene.add(g);
      marker.push({ id: 'marker' + i, pos, grad, weite });
    });

    const fernrohr = new Fernrohr(kamera, spielfeld);
    const meldungen = [];
    const entdeckt = [];
    fernrohr.meldung = (text) => meldungen.push(text);
    marker.forEach((m) => fernrohr.ziel(m.id, { name: 'Boje', bild: '🔴', pos: m.pos, hoehe: 9, beiEntdeckt: () => entdeckt.push(m.id) }));

    // Normale Kamera (wie im Spiel hinter der Figur)
    kamera.position.set(spielerPos.x, spielerPos.y + 6, spielerPos.z + 9);
    kamera.lookAt(spielerPos.x, spielerPos.y + 1.6, spielerPos.z);

    function male(dt = 0.016) {
      himmel.aktualisiere(dt, tageszeit, kamera, spielerPos);
      wasser.aktualisiere(dt);
      renderer.render(szene, kamera);
    }
    function schritt(dt, eingabe = {}) {
      fernrohr.aktualisiere(dt, { richtung: { x: 0, y: 0 }, kameraDrehung: 0, kameraNeigung: 0, ...eingabe });
    }
    knopf(document.getElementById('knopf-start'), () => fernrohr.starten(spielerPos, 0));

    let schleife = !location.search.includes('ohneSchleife');
    let zuletzt = performance.now();
    function loop(jetzt) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (jetzt - zuletzt) / 1000);
      zuletzt = jetzt;
      if (!schleife) return;
      schritt(dt);
      male(dt);
    }
    requestAnimationFrame(loop);
    window.__test = { THREE, fernrohr, kamera, marker, meldungen, entdeckt, spielerPos, male, schritt, bodenHoehe,
      set schleife(an) { schleife = an; } };
  </script>
</body>
</html>
