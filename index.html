<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inselspiel">
  <title>Inselspiel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/karte.css">
  <link rel="stylesheet" href="css/fernrohr.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="spielfeld">
    <div id="start">
      <h1>Inselspiel</h1>
      <p class="untertitel">(den richtigen Namen erfindet ihr noch!)</p>
      <p class="tippen">Tippen zum Starten</p>
    </div>

    <div id="hud">
      <div id="oben-links">
        <div id="muenz-anzeige">🪙 <span id="muenzen">0</span></div>
        <div id="hunger-anzeige" title="Essen">🍞 satt</div>
        <button id="rucksack-knopf" class="rund-knopf" aria-label="Rucksack öffnen">🎒</button>
      </div>
      <div id="uhr"></div>
      <button id="musik-knopf" class="rund-knopf" aria-label="Musik an oder aus">🎵</button>
      <div id="meldung"></div>
      <div id="hand-anzeige" title="In der Hand"></div>
      <button id="aktion-knopf" aria-label="Aktion"><span id="aktion-bild">✋</span><span id="aktion-text">Aktion</span></button>
      <button id="sprung-knopf" class="rund-knopf" aria-label="Springen">⤒</button>
    </div>

    <div id="rucksack-fenster">
      <div class="fenster-kopf">
        <h2>🎒 Dein Rucksack</h2>
        <button id="rucksack-zu" aria-label="Schließen">✕</button>
      </div>
      <div id="rucksack-raster"></div>
      <p id="rucksack-info"></p>
      <div id="rucksack-knoepfe"></div>
    </div>

    <div id="schlafen"><span>Z z z …</span></div>

    <div id="joystick"><div id="joystick-knopf"></div></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
