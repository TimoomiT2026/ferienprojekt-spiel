<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inselspiel">
  <title>Inselspiel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png?v=2">
  <!-- Die runde Spiele-Schrift "Baloo 2" (Google Fonts). Lädt nebenbei, ohne das Spiel aufzuhalten.
       Ohne Internet nimmt der Browser einfach eine Ersatz-Schrift (siehe --schrift in style.css). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/karte.css">
  <link rel="stylesheet" href="css/fernrohr.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tutorial.css">
  <link rel="stylesheet" href="css/finale.css">
  <link rel="stylesheet" href="css/rallye.css">
  <link rel="stylesheet" href="css/bewohner.css">
  <link rel="stylesheet" href="css/bilder.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="spielfeld">
    <div id="start">
      <h1>Inselspiel</h1>
      <p class="untertitel">Ein Ferienprojekt von Vater &amp; Sohn</p>
      <p class="tippen">Tippen zum Starten</p>
    </div>

    <div id="hud">
      <div id="oben-links">
        <div id="muenz-anzeige"><span data-ui-bild="muenze">🪙</span> <span id="muenzen">0</span></div>
        <div id="hunger-anzeige" title="Essen">🍞 satt</div>
        <button id="rucksack-knopf" class="rund-knopf" aria-label="Rucksack öffnen"><span data-ui-bild="rucksack">🎒</span></button>
      </div>
      <div id="uhr"></div>
      <button id="musik-knopf" class="rund-knopf" aria-label="Musik an oder aus"><span data-ui-bild="note">🎵</span></button>
      <div id="meldung"></div>
      <div id="hand-anzeige" title="In der Hand"></div>
      <button id="aktion-knopf" aria-label="Aktion"><span id="aktion-bild">✋</span><span id="aktion-text">Aktion</span></button>
      <button id="sprung-knopf" class="rund-knopf" aria-label="Springen"><span data-ui-bild="sprung">⤒</span></button>
    </div>

    <div id="rucksack-fenster">
      <div class="fenster-kopf">
        <h2><span data-ui-bild="rucksack">🎒</span> Dein Rucksack</h2>
        <button id="rucksack-zu" aria-label="Schließen">✕</button>
      </div>
      <div id="rucksack-raster"></div>
      <p id="rucksack-info"></p>
      <div id="rucksack-knoepfe"></div>
    </div>

    <div id="schlafen"><span>Z z z …</span></div>

    <div id="joystick"><div id="joystick-knopf"></div></div>
  </div>
  <!-- Nur auf Handys im Hochformat zu sehen (siehe style.css) -->
  <div id="dreh-hinweis">
    <div class="dreh-karte">
      <div><span class="dreh-handy">📱</span><span class="dreh-pfeil">↻</span></div>
      <p class="dreh-titel">Bitte dreh dein Handy quer!</p>
      <p class="dreh-text">Das Inselspiel ist für quer gemacht – dann hast du viel mehr Platz zum Entdecken. 🏝️</p>
    </div>
  </div>
  <!-- Zuerst die HUD-Bilder einsetzen, dann startet das Spiel -->
  <script type="module" src="js/ui-bilder.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
